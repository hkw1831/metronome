<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alternating Metronome</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-color: #f5f5f5;
        }
        
        h1 {
            color: #333;
            margin-bottom: 30px;
            text-align: center;
        }
        
        .controls {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
        }
        
        button {
            padding: 15px 30px;
            font-size: 18px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        
        #startBtn {
            background-color: #4CAF50;
            color: white;
        }
        
        #stopBtn {
            background-color: #f44336;
            color: white;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 8px rgba(0,0,0,0.15);
        }
        
        button:active {
            transform: translateY(0);
        }
        
        .status {
            text-align: center;
            font-size: 16px;
            margin-bottom: 20px;
        }
        
        .indicator {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background-color: #ccc;
            margin: 0 auto;
            transition: background-color 0.2s;
        }
        
        .active {
            background-color: #4CAF50;
        }
        
        .info {
            margin-top: 40px;
            text-align: center;
            color: #666;
        }
    </style>
</head>
<body>
    <h1>Alternating Metronome</h1>
    
    <div class="controls">
        <button id="startBtn">Start</button>
        <button id="stopBtn">Stop</button>
    </div>
    
    <div class="status">
        <p id="bpmDisplay">90 BPM</p>
        <p id="toneDisplay">Tone: 1</p>
        <p id="timerDisplay">Time until tone change: 30s</p>
    </div>
    
    <div class="indicator" id="beatIndicator"></div>
    
    <div class="info">
        <p>The metronome will alternate between Tone 1 and Tone 2 every 30 seconds</p>
    </div>

    <script>
        let metronome;
        let audioContext;
        let currentTone = 1;
        let intervalId;
        let secondsLeft = 30;
        
        // Initialize audio context when the page is interacted with
        document.addEventListener('click', initAudioContext, { once: true });
        
        function initAudioContext() {
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
            }
        }
        
        function createTone(frequency, duration) {
            if (!audioContext) return;
            
            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();
            
            oscillator.type = 'sine';
            oscillator.frequency.value = frequency;
            
            // Increased gain value for louder sound (from 0.5 to 0.8)
            gainNode.gain.value = 0.8;
            
            // Set up attack and release
            const now = audioContext.currentTime;
            gainNode.gain.setValueAtTime(0, now);
            // Increased gain value here too
            gainNode.gain.linearRampToValueAtTime(0.8, now + 0.01);
            gainNode.gain.linearRampToValueAtTime(0, now + duration);
            
            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);
            
            oscillator.start();
            oscillator.stop(now + duration);
            
            // Visual feedback
            const indicator = document.getElementById('beatIndicator');
            indicator.classList.add('active');
            setTimeout(() => {
                indicator.classList.remove('active');
            }, duration * 1000);
        }
        
        function playTone() {
            // Tone 1: higher pitch
            // Tone 2: lower pitch
            // Also made the frequencies slightly more distinct
            const frequency = currentTone === 1 ? 1100 : 700;
            
            // Slightly longer duration for more audible clicks
            createTone(frequency, 0.07);
        }
        
        function startMetronome() {
            if (!audioContext) initAudioContext();
            
            // Stop any existing metronome
            stopMetronome();
            
            // BPM to milliseconds conversion (60000ms / BPM)
            const interval = Math.floor(60000 / 90);
            
            // Start metronome
            playTone(); // Play first beat immediately
            metronome = setInterval(playTone, interval);
            
            // Start tone switching countdown
            secondsLeft = 30;
            updateTimerDisplay();
            intervalId = setInterval(() => {
                secondsLeft--;
                updateTimerDisplay();
                
                if (secondsLeft <= 0) {
                    // Switch tone
                    currentTone = currentTone === 1 ? 2 : 1;
                    document.getElementById('toneDisplay').textContent = `Tone: ${currentTone}`;
                    
                    // Reset countdown
                    secondsLeft = 30;
                }
            }, 1000);
        }
        
        function stopMetronome() {
            if (metronome) clearInterval(metronome);
            if (intervalId) clearInterval(intervalId);
            metronome = null;
            intervalId = null;
        }
        
        function updateTimerDisplay() {
            document.getElementById('timerDisplay').textContent = `Time until tone change: ${secondsLeft}s`;
        }
        
        // Set up event listeners
        document.getElementById('startBtn').addEventListener('click', startMetronome);
        document.getElementById('stopBtn').addEventListener('click', stopMetronome);
    </script>
</body>
</html>
